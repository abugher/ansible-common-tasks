---
- script:               "{{ item.script }}"
  args:
    creates:            "{{ item.creates|default('/does/not/create/anything') }}"
    chdir:              "{{ item.chdir|default('/') }}"
  with_items:           "{{ scripts }}"
  register:             scripts_result
  changed_when:         item.changed_when|default(scripts_result.changed)
  failed_when:          item.failed_when|default(scripts_result.rc != 0)
